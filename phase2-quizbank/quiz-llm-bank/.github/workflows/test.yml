name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: |
          python -m pytest pipeline/tests/ -v

  validators:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stage the bundled example as a working bank
        run: |
          cp examples/econometrics/course_config.json ./course_config.json
          mkdir -p output/econometrics_example_2026
          cp -r examples/econometrics/output/. output/econometrics_example_2026/
          python pipeline/schema_builder.py

      - name: Run all 7 Phase-2 validators
        run: |
          set -euo pipefail
          for v in schema structure coverage bilingual math rag content_boundary; do
            echo "=== validate_$v ==="
            PYTHONPATH=pipeline python pipeline/validators/validate_$v.py
          done
